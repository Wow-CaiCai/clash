    exclude-type: Direct

  - name: "广告拦截"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Advertising.png
    proxies:
      - REJECT
      - DIRECT

  # 收纳被普通代理组排除的流量、到期等订阅提示节点，并隐藏展示。
  # 此组不用于分流，不参与自动选择。
  - name: "订阅信息"
    type: select
    hidden: true
    include-all-providers: true
    empty-fallback: REJECT
    filter: '(?i)^(?:\[[^\]]+\]\s*)?[\p{P}\p{S}\s]*(?:官网|官網|流量|剩余|剩餘|到期|过期|套餐|订阅|(?:距离|距離)下次重置|下次重置|重置|过滤掉|traffic|expire|expired|subscription|reset|official|website)'

# 规则按从上到下的顺序匹配；具体域名规则放在通用规则之前
rules:
  # 广告规则优先匹配
  - "RULE-SET,ads,广告拦截"
  - "RULE-SET,Ad,广告拦截"

  # Blip 跨平台直连：官网、生产服务、传输中继及日志等全部子域名
  - "DOMAIN-SUFFIX,blip.net,DIRECT"
  # Windows / macOS / Android 的进程规则覆盖无域名的设备间连接
  - "PROCESS-NAME,Blip.exe,DIRECT"
  - "PROCESS-NAME,Blip,DIRECT"
  - "PROCESS-NAME,net.blip.android,DIRECT"

  # Loyalsoldier 规则中的直连项
  - RULE-SET,applications,DIRECT
  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple-direct,DIRECT

  # 私有网络直连
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - RULE-SET,lancidr,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve

  # Steam 下载与内容分发域名直连
  - "DOMAIN,steamcdn-a.akamaihd.net,DIRECT"
  - "DOMAIN-SUFFIX,steamserver.net,DIRECT"
  - "DOMAIN-SUFFIX,steamcontent.com,DIRECT"

  # 国内 AI 服务直连
  - "RULE-SET,ai-cn,DIRECT"

  # 其余海外 AI 服务走通用 AI 代理组
  - "RULE-SET,ai-global,AI"

  # GitHub 及 npm 统一使用漏网之鱼；Copilot 优先使用前面的 AI 规则
  # 保留此规则：其中的 github 关键词也会覆盖后续直连列表中的部分域名。
  - "RULE-SET,GitHub,漏网之鱼"

  # OneDrive 明确走漏网之鱼，优先于后面的通用直连规则。
  - "RULE-SET,OneDrive,漏网之鱼"

  # 其他单独指定的代理服务
  # assrt.net 及其子域名优先走代理，避免被后续国内直连规则覆盖。
  - "DOMAIN-SUFFIX,assrt.net,漏网之鱼"
  - "RULE-SET,TikTok,TikTok"
  - RULE-SET,apple,DIRECT

  # X / Twitter 使用 blackmatrix7 仓库规则集
  - "RULE-SET,Twitter,社交媒体"

  # Telegram 域名、IP 和应用使用 blackmatrix7 仓库规则集
  - "RULE-SET,Telegram,社交媒体"

  # 通用直连规则与中国区兜底规则放在单项分流之后
  - RULE-SET,direct,DIRECT
  - GEOSITE,CN,DIRECT
  - RULE-SET,cncidr,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve

  # 未匹配规则由漏网之鱼代理组自选
  - "MATCH,漏网之鱼"
