    empty-fallback: REJECT
    filter: '(?i)家宽|家寬|家庭宽带|家庭寬帶|住宅|住家|residential'
    exclude-filter: '(?i)^(?:\[[^\]]+\]\s*)?[\p{P}\p{S}\s]*(?:官网|官網|流量|剩余|剩餘|到期|过期|套餐|订阅|重置|过滤掉|traffic|expire|expired|subscription|reset|official|website)|家宽机场|家寬機場'
