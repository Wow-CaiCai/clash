# Last modified: 2026-10-13 01:41:39 (UTC+08:00)
# Mihomo / Clash Meta：多机场订阅 + MyRule 分流。
# 良心云使用在线订阅；三元店内置 23 个家宽 / 住宅节点。
# 独立导入本配置，启用客户端 TUN / VPN 权限，避免全局覆写覆盖配置。
# DNS 使用双栈 fake-ip 和 DoH；百度、公司内网使用指定 DNS。
# 系统 DNS 未被客户端接管时可设为 127.0.0.1；确保 53 端口未被占用。
# 分流基于 MyRule.yaml，后续修改不会自动同步。
# 含订阅令牌和节点认证信息，请勿公开分享。

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
# 开启 IPv6 连接；DNS 同时支持 IPv6 解析。
ipv6: true
profile:
  store-selected: true
  store-fake-ip: true

# 自动更新 GEOSITE / GEOIP 数据。
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat

# TUN 接管 IPv4 / IPv6 流量及 DNS 查询。
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  # TUN 接口与 IPv6 fake-ip 地址池使用不同网段。
  inet6-address:
    - fdfe:dcba:9877::1/126
  route-address:
    - 0.0.0.0/0
    - "::/0"
  dns-hijack:
    - any:53
    - tcp://any:53

dns:
  enable: true
  listen: '0.0.0.0:53'
  enhanced-mode: 'fake-ip'
  fake-ip-range: '198.18.0.1/16'
  fake-ip-range6: 'fdfe:dcba:9876::1/64'
  fake-ip-filter-mode: 'blacklist'
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: false
  ipv6: true
  fake-ip-filter:
    - '*.lan'
    - '*.arpa'
    - '*.local'
    - 'geosite:private'
    - '+.internal.corp.com'
    - '+.market.xiaomi.com'
    - 'geosite:category-ntp'
    - 'geosite:geolocation-cn'
    - 'localhost.ptlogin2.qq.com'
    - 'geosite:connectivity-check'
  # IP 地址 DoH 用于引导解析，不依赖系统 DNS。
  default-nameserver:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://223.6.6.6/dns-query#DIRECT'
  # 节点入口独立直连解析，避免 DNS 与代理互相依赖。
  proxy-server-nameserver:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://223.6.6.6/dns-query#DIRECT'
  nameserver:
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
    - 'https://doh.360.cn/dns-query'
    - 'https://dns.google/dns-query'
    - 'https://cloudflare-dns.com/dns-query'
  nameserver-policy:
    '+.baidu.com':
      - 'https://dns.alidns.com/dns-query'
    '+.internal.corp.com':
      - '10.0.0.1'

# 机场A：良心云；机场C：三元店家宽。新增机场需使用唯一名称、路径和前缀。
proxy-providers:
  机场A:
    type: http
    url: "https://liangxin.xyz/api/v1/liangxin?OwO=568a8fa6566a6a365d2fc182cdc8e4bf"
    path: ./proxy-providers/airport-a.yaml
    interval: 3600
    # 直连下载订阅。
    proxy: DIRECT
    override:
      additional-prefix: "[良心云] "
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204

