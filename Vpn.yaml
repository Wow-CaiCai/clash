# Last modified: 2026-10-06 17:47:49 (UTC+08:00)
# 多机场订阅 + MyRule 分流（适用于近期版本的 Mihomo / Clash Meta 内核）
# 使用步骤：
# 1. 机场A 使用在线订阅；机场C 已内置 87 个条目（85 个实际节点），无需临时订阅链接。
#    更换 A 时替换整个 url；更新 C 时替换其 payload 中的节点。
#    未使用的机场请删除对应 provider；各分组会自动引入所有 provider。
# 2. 将本文件作为独立本地配置导入，启用客户端 TUN / VPN 模式及必要的服务权限。
#    本文件含订阅令牌和节点认证信息，请勿公开分享或提交到公开仓库。
# 3. 导入时不要再叠加会覆盖 DNS、TUN 或分组的全局覆写。
# 4. macOS / Windows 的 TUN 不一定能接管发往局域网路由器的 DNS。
#    如客户端未自动设置系统 DNS，请将当前网卡 DNS 设为 127.0.0.1（本 DNS 服务监听 53）。
#    若 53 端口被其他 DNS 服务占用，需要先解决冲突；不要仅改监听端口后继续使用上述网卡设置。
#    如果需要解析 NAS 等局域网名称，网卡 DNS 指向本机后，须将下方局域网策略中的 system
#    换为实际路由器的 DNS 地址，避免系统 DNS 再次指向本机而形成回环。
# 5. 浏览器内置安全 DNS、系统私人 DNS 和其他 VPN 可能绕过普通 53 端口接管。
#    建议关闭浏览器内置安全 DNS，统一交给本配置解析；本文件不修改系统网络设置。
# DNS 设计：国内 / 直连域名使用国内 DoH；其他域名使用经 DNS代理 组传输的海外 DoH。
# 引导解析和节点入口解析也使用 DoH；仅局域网名称显式交给系统 DNS。
# 此设计兼顾国内访问速度与海外查询隐私，不保证任何客户端 / 系统下绝对零泄露。
# 分流规则与规则来源基于 MyRule.yaml，已移除 ChatGPT / Gemini 独立分流；后续修改 MyRule.yaml 不会自动同步到本文件。

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
# 接管 IPv6 流量；DNS 下方不返回 AAAA，常规域名访问优先使用 IPv4。
ipv6: true
profile:
  store-selected: true
  store-fake-ip: true

# MyRule 使用 GEOSITE / GEOIP；使用官方维护的数据文件，避免依赖系统 DNS 做引导。
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat

# 生效需要客户端提供 TUN / VPN 权限。创建本文件不会开启系统 TUN。
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  inet6-address:
    - fdfe:dcba:9876::1/126
  route-address:
    - 0.0.0.0/0
    - "::/0"
  dns-hijack:
    - any:53
    - tcp://any:53

dns:
  enable: true
  listen: 127.0.0.1:53
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - localhost
    - "+.localhost"
    - "+.lan"
    - "+.local"
    - "+.home.arpa"
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  respect-rules: true
  prefer-h3: false
  # IP 地址形式的 DoH，建立加密 DNS 连接时无需先通过明文 DNS 查询服务器域名。
  default-nameserver:
    - "https://223.5.5.5/dns-query#DIRECT"
    - "https://223.6.6.6/dns-query#DIRECT"
  # 订阅入口解析独立直连，避免先连代理才能解析代理入口的循环依赖。
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query#DIRECT"
    - "https://223.6.6.6/dns-query#DIRECT"
  # MyRule 判定为 DIRECT 的连接使用国内加密 DNS，有利于 CDN 就近分配。
  direct-nameserver:
    - "https://223.5.5.5/dns-query#DIRECT"
    - "https://223.6.6.6/dns-query#DIRECT"
  direct-nameserver-follow-policy: false
  # 默认查询强制经过独立代理组；没有可用节点时不回退到直连 DNS。
  nameserver:
    - "https://1.1.1.1/dns-query#DNS代理"
    - "https://8.8.8.8/dns-query#DNS代理"
  nameserver-policy:
    "geosite:cn":
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://223.6.6.6/dns-query#DIRECT"
    # 局域网名称是有意保留的例外，防止 NAS / 打印机名称被发送到公网 DNS。
    # system 必须指向实际局域网 DNS；若系统 DNS 已改为本机，将其替换为路由器 DNS IP。
    "+.localhost": system
    "+.lan": system
    "+.local": system
    "+.home.arpa": system

# 扩展机场时复制一个条目，使用唯一名称、缓存路径和前缀即可。
# provider 保留原始节点条目；节点过滤统一在后面的代理组中设置。
# 机场A 为良心云；机场C 为三元店的静态节点集合。
proxy-providers:
  机场A:
    type: http
    url: "https://liangxin.xyz/api/v1/liangxin?OwO=568a8fa6566a6a365d2fc182cdc8e4bf"
    path: ./proxy-providers/airport-a.yaml
    interval: 3600
    # 订阅下载走直连，首次加载不依赖尚未导入的代理。
    proxy: DIRECT
    override:
      additional-prefix: "[良心云] "
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204

  机场C:
    type: inline
    override:
      additional-prefix: "[三元店] "
