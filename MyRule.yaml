    empty-fallback: REJECT
    exclude-type: Direct
    exclude-filter: '(?i)^(?:\[[^\]]+\]\s*)?[\p{P}\p{S}\s]*(?:官网|官網|流量|剩余|剩餘|到期|过期|套餐|订阅|(?:距离|距離)下次重置|下次重置|重置|过滤掉|traffic|expire|expired|subscription|reset|official|website)'
    url: https://cp.cloudflare.com/generate_204
    interval: 60
    tolerance: 50
    timeout: 3000
    max-failed-times: 1
    lazy: true

