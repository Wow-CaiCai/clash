    format: yaml
    interval: 86400
    # 原 jsDelivr 地址检查时返回 404，改为同一仓库的原始地址，规则内容和顺序不变。
    url: https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/clash/cn.yaml

  ai-global:
    type: http
    proxy: DIRECT
    path: ./ruleset/ai-global.yaml
    behavior: classical
    format: yaml
