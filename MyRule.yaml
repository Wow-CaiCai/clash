      - DIRECT
# 规则按从上到下的顺序匹配；具体域名规则放在通用规则之前
rules:
  # 广告规则优先匹配
  - "RULE-SET,ads,广告拦截"
  - "RULE-SET,Ad,广告拦截"

  # Blip 跨平台直连：官网、生产服务、传输中继及日志等全部子域名
  - "DOMAIN-SUFFIX,blip.net,DIRECT"
  # Windows / macOS / Android 的进程规则覆盖无域名的设备间连接
  - "PROCESS-NAME,Blip.exe,DIRECT"
  - "PROCESS-NAME,Blip,DIRECT"
  - "PROCESS-NAME,net.blip.android,DIRECT"

  # Loyalsoldier 规则中的直连项
  - RULE-SET,applications,DIRECT
  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple-direct,DIRECT

  # 私有网络直连
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - RULE-SET,lancidr,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve

  # Steam 下载与内容分发域名直连
  - "DOMAIN,steamcdn-a.akamaihd.net,DIRECT"
  - "DOMAIN-SUFFIX,steamserver.net,DIRECT"
  - "DOMAIN-SUFFIX,steamcontent.com,DIRECT"
  - "DOMAIN-SUFFIX,steamstatic.com,DIRECT"
  - "DOMAIN-SUFFIX,steamusercontent.com,DIRECT"

  # Pixiv 及图片、资讯站域名使用可手动选择的 Pixiv 代理组
  - "DOMAIN-SUFFIX,pixiv.net,Pixiv"
  - "DOMAIN-SUFFIX,pximg.net,Pixiv"
  - "DOMAIN-SUFFIX,pixivision.net,Pixiv"

  # ChatGPT / OpenAI 独立选择地区
  - "RULE-SET,chatgpt,ChatGPT"

  # Gemini / Google AI 使用仓库规则集，独立选择地区
  - "RULE-SET,google-ai,Gemini"

  # 国内 AI 服务直连
  - "RULE-SET,ai-cn,DIRECT"

  # 其余海外 AI 服务走通用 AI 代理组
  - "RULE-SET,ai-global,AI"

  # GitHub 及 npm 使用仓库规则集；Copilot 优先使用前面的 AI 规则
  - "RULE-SET,GitHub,GitHub"

  # Bing 单独走微软代理组，优先于微软应用直连规则
  - "RULE-SET,Bing,Microsoft"

  # 其他中国区微软服务直连；Windows 更新、商店、Office 等规则也直连
  - GEOSITE,microsoft@cn,DIRECT
  - RULE-SET,MicrosoftAPPs,DIRECT

  # 其余微软服务走微软代理组
  - "RULE-SET,Microsoft,Microsoft"

  # 其他单独指定的代理服务
  - "DOMAIN,api.assrt.net,漏网之鱼"
  - "RULE-SET,youtube,Youtube"
  - "RULE-SET,TikTok,TikTok"
  - "DOMAIN-SUFFIX,steampowered.com,Steam"
  - "DOMAIN-SUFFIX,steamcommunity.com,Steam"
  - RULE-SET,apple,DIRECT
  - "RULE-SET,google,Google"

  # X / Twitter 使用 blackmatrix7 仓库规则集
  - "RULE-SET,Twitter,X"

  # Telegram 域名、IP 和应用使用 blackmatrix7 仓库规则集
  - "RULE-SET,Telegram,Telegram"

  # 通用直连规则与中国区兜底规则放在单项分流之后
  - RULE-SET,direct,DIRECT
  - GEOSITE,CN,DIRECT
  - RULE-SET,cncidr,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve

  # 未匹配规则由漏网之鱼代理组自选
  - "MATCH,漏网之鱼"
