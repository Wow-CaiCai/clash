    proxies:
      - 自动选择
      - "香港节点"
      - "日本节点"
      - "新加坡节点"
      - "美国节点"
      - "台湾节点"
      - "其他地区"
      - DIRECT

  - name: "AI"
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AI.png
    proxies:
      - "美国节点"
      - "日本节点"
      - "新加坡节点"
      - "香港节点"
      - "台湾节点"
      - "其他地区"
