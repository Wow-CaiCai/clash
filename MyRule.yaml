# Last modified: 2026-10-17 01:47:26 (UTC+08:00)
# 端口、运行模式、IPv6、TUN 与控制器由 Clash Verge Rev 应用设置管理。
tcp-concurrent: true
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true

# 自动更新 GEOSITE / GEOIP 数据。
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat

# 白名单分流：域名 DNS 策略与下方路由规则保持同序，未匹配一律通过默认代理查询。
dns:
  enable: true
  listen: '[::]:53'
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,ads,fake-ip
    - RULE-SET,Ad,fake-ip
    - DOMAIN-SUFFIX,lan,real-ip
    - DOMAIN-SUFFIX,local,real-ip
    - DOMAIN-SUFFIX,arpa,real-ip
    - DOMAIN,localhost,real-ip
    - DOMAIN-SUFFIX,blip.net,real-ip
    - RULE-SET,applications,real-ip
    - DOMAIN,clash.razord.top,real-ip
    - DOMAIN,yacd.haishan.me,real-ip
    - RULE-SET,private,real-ip
    - RULE-SET,icloud,real-ip
    - RULE-SET,apple-direct,real-ip
    - GEOSITE,private,real-ip
    - DOMAIN,steamcdn-a.akamaihd.net,real-ip
    - DOMAIN-SUFFIX,steamserver.net,real-ip
    - DOMAIN-SUFFIX,steamcontent.com,real-ip
    - RULE-SET,ai-cn,real-ip
    - RULE-SET,ai-global,fake-ip
    - RULE-SET,GitHub,fake-ip
    - RULE-SET,OneDrive,fake-ip
    - DOMAIN-SUFFIX,assrt.net,fake-ip
    - RULE-SET,TikTok,fake-ip
    - RULE-SET,apple,real-ip
    - RULE-SET,Twitter,fake-ip
    - RULE-SET,Telegram,fake-ip
    - RULE-SET,direct,real-ip
    - GEOSITE,CN,real-ip
    - MATCH,fake-ip
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: false
  # 引导解析仅使用 IP 地址形式的国内 DoH，无系统 DNS、明文 DNS 或明文回退。
  default-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://223.6.6.6/dns-query#DIRECT
  # 节点域名须先直连解析，避免先连接代理、再解析代理的循环依赖。
  proxy-server-nameserver: &domestic-doh
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  # 进程 / IP 白名单实际命中 DIRECT 后，连接阶段同样使用国内 DoH。
  direct-nameserver: *domestic-doh
  direct-nameserver-follow-policy: false
  nameserver:
    - https://1.1.1.1/dns-query#默认代理
    - https://8.8.8.8/dns-query#默认代理
  # DNS 地址后附加代理组名，显式使用该组当前节点；respect-rules 仅匹配 DNS 服务器地址。
  nameserver-policy:
    rule-set:ads:
      - https://dns.alidns.com/dns-query#广告拦截
      - https://doh.pub/dns-query#广告拦截
    rule-set:Ad:
      - https://dns.alidns.com/dns-query#广告拦截
      - https://doh.pub/dns-query#广告拦截
    +.lan: *domestic-doh
    +.local: *domestic-doh
    +.arpa: *domestic-doh
    localhost: *domestic-doh
    +.blip.net: *domestic-doh
    rule-set:applications: *domestic-doh
    clash.razord.top: *domestic-doh
    yacd.haishan.me: *domestic-doh
    rule-set:private: *domestic-doh
    rule-set:icloud: *domestic-doh
    rule-set:apple-direct: *domestic-doh
    geosite:private: *domestic-doh
    steamcdn-a.akamaihd.net: *domestic-doh
    +.steamserver.net: *domestic-doh
    +.steamcontent.com: *domestic-doh
    rule-set:ai-cn: *domestic-doh
    rule-set:ai-global:
      - https://1.1.1.1/dns-query#AI
      - https://8.8.8.8/dns-query#AI
    rule-set:GitHub:
      - https://1.1.1.1/dns-query#默认代理
      - https://8.8.8.8/dns-query#默认代理
    rule-set:OneDrive:
      - https://1.1.1.1/dns-query#默认代理
      - https://8.8.8.8/dns-query#默认代理
    +.assrt.net:
      - https://1.1.1.1/dns-query#默认代理
      - https://8.8.8.8/dns-query#默认代理
    rule-set:TikTok:
      - https://1.1.1.1/dns-query#TikTok
      - https://8.8.8.8/dns-query#TikTok
    rule-set:apple: *domestic-doh
    rule-set:Twitter:
      - https://1.1.1.1/dns-query#社交媒体
      - https://8.8.8.8/dns-query#社交媒体
    rule-set:Telegram:
      - https://1.1.1.1/dns-query#社交媒体
      - https://8.8.8.8/dns-query#社交媒体
    rule-set:direct: *domestic-doh
    geosite:CN: *domestic-doh

